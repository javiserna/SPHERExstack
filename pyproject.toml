[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spherexstack"
version = "1.0.0"
description = "Stack, slice, and animate any field of the SPHEREx sky survey into monochromatic mosaics, spectral cubes, and false-color RGB images"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Javier Serna", email = "jserna@ou.edu" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]

dependencies = [
    "numpy>=1.24",
    "astropy>=5.3",
    "reproject>=0.11",
]

[project.optional-dependencies]
animate = [
    "matplotlib>=3.7",
    "imageio>=2.31",
    "pillow>=10.0",
]
dev = [
    "spherexstack[animate]",
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/javiserna/SPHERExstack"

[project.scripts]
spherex-get = "spherexstack.cli:get"
spherex-query = "spherexstack.cli:query"
spherex-download = "spherexstack.cli:download"
spherex-mosaic = "spherexstack.cli:mosaic"
spherex-merge = "spherexstack.cli:merge"
spherex-cube = "spherexstack.cli:cube"
spherex-animate = "spherexstack.cli:animate"
spherex-rgb = "spherexstack.cli:rgb"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that require network access (skipped by default)",
]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
